name: Build and release
run-name: Release v${{ inputs.version }} (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Committed application version'
        required: true
        type: string
      platform:
        description: 'Build target'
        type: choice
        options: [all, windows, android]
        default: all
      mode:
        description: 'Publish automatically, build only, or prepare environment only'
        type: choice
        options: [publish, build, prepare, draft]
        default: publish
      channel:
        description: 'Testing or stable release'
        type: choice
        options: [testing, stable]
        default: testing
      android_code:
        description: '0 uses the committed Android version code'
        type: string
        default: '0'
      notes:
        description: 'Release notes'
        type: string
        required: true
      reuse_run:
        description: 'Optional earlier build; failed-run retries recover automatically'
        type: string
        default: ''
      skip_startup:
        description: 'Only skip startup with explicit user authorization'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      ANDROID_CODE: ${{ inputs.android_code }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_NOTES: ${{ inputs.notes }}
      RELEASE_MODE: ${{ inputs.mode }}
      REQUESTED_REUSE: ${{ inputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          check-latest: false
          cache: pip
          cache-dependency-path: launcher/requirements.txt
      - name: Install Python dependencies once
        run: python -m pip install -r launcher/requirements.txt
      - name: Select fresh build or automatic recovery
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/ci_release.py plan --version $env:RELEASE_VERSION --platform $env:BUILD_PLATFORM --android-code $env:ANDROID_CODE --mode $env:RELEASE_MODE "--reuse-run=$env:REQUESTED_REUSE"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select a safe build/recovery path.' }
      - name: Check public source
        run: python tools/ci_release.py check
      - name: Use installed JDK 17
        id: android
        if: steps.plan.outputs.reuse_run == '' && inputs.platform != 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path "$env:JAVA_HOME_17_X64/bin/java.exe")) { throw 'Runner JDK 17 is missing.' }
          if (!(Test-Path "$env:ANDROID_HOME")) { throw 'Runner Android SDK is missing.' }
          "JAVA_HOME=$env:JAVA_HOME_17_X64" >> $env:GITHUB_ENV
          "sdk_root=$env:ANDROID_HOME" >> $env:GITHUB_OUTPUT
          $missing = !(Test-Path "$env:ANDROID_HOME/build-tools/35.0.1/aapt2.exe") -or !(Test-Path "$env:ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar") -or !(Test-Path "$env:ANDROID_HOME/platforms/android-36/android.jar")
          "missing=$($missing.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Restore Android SDK tools
        if: steps.android.outputs.missing == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.android.outputs.sdk_root }}/build-tools/35.0.1
            ${{ steps.android.outputs.sdk_root }}/platforms/android-36
          key: android-sdk-${{ runner.os }}-35.0.1-api36
      - name: Install only missing Android tools
        if: steps.plan.outputs.reuse_run == '' && inputs.platform != 'windows'
        shell: pwsh
        run: |
          $missing = @()
          if (!(Test-Path "$env:ANDROID_HOME/build-tools/35.0.1/aapt2.exe") -or !(Test-Path "$env:ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar")) { $missing += 'build-tools;35.0.1' }
          if (!(Test-Path "$env:ANDROID_HOME/platforms/android-36/android.jar")) { $missing += 'platforms;android-36' }
          if ($missing.Count) {
            & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" @missing
            if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed.' }
          } else { Write-Output 'Required Android tools already present; no install.' }
      - name: Restore engine and templates
        if: steps.plan.outputs.reuse_run == ''
        uses: actions/cache@v4
        with:
          path: |
            artifacts/ci-toolchain
            artifacts/export-templates
            artifacts/godot-licenses
          key: ci-toolchain-windows-${{ hashFiles('tools/ci-toolchain.json', 'tools/install_godot.py') }}
      - name: Prepare environment without building or publishing
        if: inputs.mode == 'prepare'
        run: python tools/ci_release.py prepare --platform $env:BUILD_PLATFORM
      - name: Build and sign once
        if: inputs.mode != 'prepare' && steps.plan.outputs.reuse_run == ''
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        shell: pwsh
        run: |
          python tools/ci_release.py build --version $env:RELEASE_VERSION --platform $env:BUILD_PLATFORM --android-code $env:ANDROID_CODE --channel $env:RELEASE_CHANNEL --notes $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { throw 'Build failed; nothing is public.' }
      - name: Remove signing material
        if: always()
        run: python tools/ci_release.py clean
      - name: Save completed packages for recovery
        if: success() && inputs.mode != 'prepare' && steps.plan.outputs.reuse_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            build/ci/*.zip
            build/ci/*.apk
            build/ci/release.json
            build/ci/release.sig
            build/ci/SHA256SUMS.txt
            build/ci/build-check.json
      - name: Recover completed packages without building
        if: steps.plan.outputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: build/ci
          github-token: ${{ github.token }}
          run-id: ${{ steps.plan.outputs.reuse_run }}
      - name: Verify packages and optional startup
        if: inputs.mode != 'prepare'
        env:
          SKIP_STARTUP: ${{ inputs.skip_startup }}
          BUILD_SOURCE_SHA: ${{ steps.plan.outputs.source }}
        shell: pwsh
        run: |
          $optional = @()
          if ($env:SKIP_STARTUP -eq 'true') { $optional += '--skip-startup' }
          python tools/verify_remote_release.py --directory build/ci --version $env:RELEASE_VERSION --platform $env:BUILD_PLATFORM --channel $env:RELEASE_CHANNEL --source $env:BUILD_SOURCE_SHA @optional
          if ($LASTEXITCODE -ne 0) { throw 'Verification failed; nothing is public.' }
      - name: Pin recovered packages to their original source
        if: steps.plan.outputs.reuse_run != '' && inputs.mode != 'build' && inputs.mode != 'prepare'
        env:
          BUILD_SOURCE_SHA: ${{ steps.plan.outputs.source }}
        shell: pwsh
        run: |
          git fetch --depth=1 origin $env:BUILD_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch original source.' }
          git checkout --detach $env:BUILD_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select original source.' }
      - name: Upload and publish automatically
        if: inputs.mode == 'publish' || inputs.mode == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/ci_release.py publish --version $env:RELEASE_VERSION --platform $env:BUILD_PLATFORM --channel $env:RELEASE_CHANNEL --mode $env:RELEASE_MODE --notes $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed; rerun this job to reuse saved packages.' }
          gh release view "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --json url,isDraft,isPrerelease,assets,targetCommitish | Out-File build/ci/publication.json -Encoding utf8
      - name: Keep small result records
        if: always() && inputs.mode != 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/ci/verification.json
            build/ci/windows-startup.log
            build/ci/publication.json
      - name: Keep export logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-logs-${{ github.run_attempt }}
          path: logs/ci-*-export*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Result summary
        if: always()
        shell: pwsh
        run: |
          "Version: $env:RELEASE_VERSION; Mode: $env:RELEASE_MODE; Source: ${{ steps.plan.outputs.source }}; Reuse: ${{ steps.plan.outputs.reuse_run }}; Result: ${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/ci/publication.json) {
            $publication = Get-Content build/ci/publication.json -Raw | ConvertFrom-Json
            "Release: $($publication.url); Draft: $($publication.isDraft)" >> $env:GITHUB_STEP_SUMMARY
          }
