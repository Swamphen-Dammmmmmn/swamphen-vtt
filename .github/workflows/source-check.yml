name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          check-latest: false
      - run: python -m pip install -r launcher/requirements.txt
      - run: python tools/ci_release.py check
      - run: python -m unittest discover -s tests -p test_ci_release.py
